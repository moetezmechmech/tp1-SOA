server:
  port: 8082

spring:
  application:
    name: cours
  datasource:
    url: 'jdbc:h2:mem:coursdb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'